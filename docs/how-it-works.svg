<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 880" role="img" aria-label="How a recorded handover becomes a TCCC card" style="width:100%;height:auto;font-family:Geist,system-ui,-apple-system,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a9894"/></marker>
<style>.t{font-size:16px;font-weight:600;fill:#181818}.s{font-size:13px;fill:#5f5d5a}.c{font-size:12.5px;font-weight:600;fill:#181818}.cs{font-size:11.5px;fill:#706e6b}
.ln{font-size:11px;font-weight:600;fill:#868685;letter-spacing:.08em}.lt{font-size:15px;font-weight:600;fill:#181818}.lw{font-size:12px;fill:#868685}
.nt{font-size:13px;font-weight:600;fill:#7a4a06}.ns{font-size:12.5px;fill:#5f5d5a}</style></defs>
<rect x="20" y="20" width="4" height="70" rx="2" fill="#c9c7c2"/><text x="36" y="46" class="ln">INPUT</text><text x="36" y="66" class="lt">Recording</text><text x="36" y="84" class="lw">as recorded</text>
<rect x="20" y="140" width="4" height="90" rx="2" fill="#0065b4"/><text x="36" y="166" class="ln">STEP 1</text><text x="36" y="186" class="lt">Listen</text><text x="36" y="204" class="lw">AI, two tools</text>
<rect x="20" y="280" width="4" height="90" rx="2" fill="#0065b4"/><text x="36" y="306" class="ln">STEP 2</text><text x="36" y="326" class="lt">Read</text><text x="36" y="344" class="lw">AI</text>
<rect x="20" y="420" width="4" height="140" rx="2" fill="#868685"/><text x="36" y="446" class="ln">STEP 3</text><text x="36" y="466" class="lt">Check</text><text x="36" y="484" class="lw">fixed rules, no AI</text>
<rect x="20" y="610" width="4" height="90" rx="2" fill="#c9c7c2"/><text x="36" y="636" class="ln">STEP 4</text><text x="36" y="656" class="lt">Output</text><text x="36" y="674" class="lw">card + to-do list</text>
<rect x="20" y="750" width="4" height="110" rx="2" fill="#2f7d4f"/><text x="36" y="776" class="ln">STEP 5</text><text x="36" y="796" class="lt">Medic</text><text x="36" y="814" class="lw">human in the loop</text>
<rect x="410" y="20" width="350" height="70" rx="12" fill="#ffffff" stroke="#c9c7c2" stroke-width="1.5"/><text x="585.0" y="50" text-anchor="middle" class="t">Recorded handover</text><text x="585.0" y="72" text-anchor="middle" class="s">radio crackle, gunfire, two voices: not cut, not cleaned</text>
<path d="M585,90 C585,115.0 390,115.0 390,136" fill="none" stroke="#9a9894" stroke-width="1.6" marker-end="url(#a)"/><path d="M585,90 C585,115.0 780,115.0 780,136" fill="none" stroke="#9a9894" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="230" y="140" width="320" height="90" rx="12" fill="#eef5fb" stroke="#0065b4" stroke-width="1.5"/><text x="390.0" y="170" text-anchor="middle" class="t">Listener 1: ElevenLabs Scribe</text><text x="390.0" y="192" text-anchor="middle" class="s">medical speech-to-text, told to expect</text><text x="390.0" y="211" text-anchor="middle" class="s">words like TXA, IV, tourniquet</text>
<rect x="620" y="140" width="320" height="90" rx="12" fill="#eef5fb" stroke="#0065b4" stroke-width="1.5"/><text x="780.0" y="170" text-anchor="middle" class="t">Listener 2: Qwen Omni</text><text x="780.0" y="192" text-anchor="middle" class="s">a second, independent</text><text x="780.0" y="211" text-anchor="middle" class="s">speech-to-text listen</text>
<path d="M940,185 L996,185" stroke="#c9c7c2" stroke-dasharray="4 4"/><rect x="1000" y="134" width="300" height="110" rx="10" fill="#fffaf2" stroke="#f0dcbc"/><text x="1016" y="158" class="nt">Why two listeners?</text><text x="1016" y="180" class="ns">Noisy radio gets misheard. A value both</text><text x="1016" y="199" class="ns">listeners heard is right 98% of the time;</text><text x="1016" y="218" class="ns">a value only one heard, 81%. When they</text><text x="1016" y="237" class="ns">disagree, the card asks; it never guesses.</text>
<path d="M390,230 C390,255.0 530,255.0 530,276" fill="none" stroke="#9a9894" stroke-width="1.6" marker-end="url(#a)"/><path d="M780,230 C780,255.0 640,255.0 640,276" fill="none" stroke="#9a9894" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="370" y="280" width="430" height="90" rx="12" fill="#eef5fb" stroke="#0065b4" stroke-width="1.5"/><text x="585.0" y="310" text-anchor="middle" class="t">Reader: Gemini Flash</text><text x="585.0" y="332" text-anchor="middle" class="s">fills each box, quoting the words it used;</text><text x="585.0" y="351" text-anchor="middle" class="s">if the listeners disagree, leaves it blank and flags it</text>
<path d="M585,370 C585,395.0 585,395.0 585,416" fill="none" stroke="#9a9894" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="235" y="420" width="705" height="140" rx="12" fill="#f4f3ef" stroke="#868685" stroke-width="1.5"/>
<text x="587" y="450" text-anchor="middle" class="t">Automatic checks on every value</text><rect x="245" y="465" width="131" height="76" rx="10" fill="#ffffff" stroke="#c9c7c2"/><text x="310.5" y="487" text-anchor="middle" class="c">Said in the recording?</text><text x="310.5" y="507" text-anchor="middle" class="cs">every value must appear</text><text x="310.5" y="524" text-anchor="middle" class="cs">in what was heard</text><rect x="384" y="465" width="131" height="76" rx="10" fill="#ffffff" stroke="#c9c7c2"/><text x="449.5" y="487" text-anchor="middle" class="c">Right format?</text><text x="449.5" y="507" text-anchor="middle" class="cs">times as 4 digits,</text><text x="449.5" y="524" text-anchor="middle" class="cs">doses with units</text><rect x="523" y="465" width="131" height="76" rx="10" fill="#ffffff" stroke="#c9c7c2"/><text x="588.5" y="487" text-anchor="middle" class="c">Medically plausible?</text><text x="588.5" y="507" text-anchor="middle" class="cs">SpO2 50 to 100,</text><text x="588.5" y="524" text-anchor="middle" class="cs">BP top above bottom</text><rect x="662" y="465" width="131" height="76" rx="10" fill="#ffffff" stroke="#c9c7c2"/><text x="727.5" y="487" text-anchor="middle" class="c">Anything missing?</text><text x="727.5" y="507" text-anchor="middle" class="cs">name, evac priority,</text><text x="727.5" y="524" text-anchor="middle" class="cs">tourniquet time, dose</text><rect x="801" y="465" width="131" height="76" rx="10" fill="#ffffff" stroke="#c9c7c2"/><text x="866.5" y="487" text-anchor="middle" class="c">Listeners agree?</text><text x="866.5" y="507" text-anchor="middle" class="cs">sets each value's</text><text x="866.5" y="524" text-anchor="middle" class="cs">confidence</text>
<path d="M940,490 L996,490" stroke="#c9c7c2" stroke-dasharray="4 4"/><rect x="1000" y="440" width="300" height="110" rx="10" fill="#fffaf2" stroke="#f0dcbc"/><text x="1016" y="464" class="nt">If a check fails</text><text x="1016" y="486" class="ns">the value is left blank and listed for</text><text x="1016" y="505" class="ns">the medic. Nothing is guessed, and</text><text x="1016" y="524" class="ns">every value on the card traces back</text><text x="1016" y="543" class="ns">to words in the recording.</text>
<path d="M587,560 C587,585.0 390,585.0 390,606" fill="none" stroke="#9a9894" stroke-width="1.6" marker-end="url(#a)"/><path d="M587,560 C587,585.0 780,585.0 780,606" fill="none" stroke="#9a9894" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="230" y="610" width="320" height="90" rx="12" fill="#ffffff" stroke="#c9c7c2" stroke-width="1.5"/><text x="390.0" y="640" text-anchor="middle" class="t">TCCC card (DD Form 1380)</text><text x="390.0" y="662" text-anchor="middle" class="s">filled PDF and body diagram,</text><text x="390.0" y="681" text-anchor="middle" class="s">read back to confirm every box</text>
<rect x="620" y="610" width="320" height="90" rx="12" fill="#ffffff" stroke="#c9c7c2" stroke-width="1.5"/><text x="780.0" y="640" text-anchor="middle" class="t">Medic's to-do list</text><text x="780.0" y="662" text-anchor="middle" class="s">what to ask the sender, what to check,</text><text x="780.0" y="681" text-anchor="middle" class="s">confidence for each value</text>
<path d="M390,700 C390,725.0 520,725.0 520,746" fill="none" stroke="#9a9894" stroke-width="1.6" marker-end="url(#a)"/><path d="M780,700 C780,725.0 650,725.0 650,746" fill="none" stroke="#9a9894" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="305" y="750" width="560" height="110" rx="12" fill="#eaf5ee" stroke="#2f7d4f" stroke-width="1.5"/><text x="585.0" y="780" text-anchor="middle" class="t">Human in the loop: the medic decides</text><text x="585.0" y="802" text-anchor="middle" class="s">reviews every card; asks the sender for anything missing;</text><text x="585.0" y="821" text-anchor="middle" class="s">confirms flagged values against the recording;</text><text x="585.0" y="840" text-anchor="middle" class="s">signs and attaches it. The system only drafts.</text>
<path d="M865,805 L996,805" stroke="#c9c7c2" stroke-dasharray="4 4"/><rect x="1000" y="758" width="300" height="91" rx="10" fill="#fffaf2" stroke="#f0dcbc"/><text x="1016" y="782" class="nt">About 1 to 1.5 minutes a card to review</text><text x="1016" y="804" class="ns">plus about a minute per item to ask or</text><text x="1016" y="823" class="ns">check, instead of 5 to 8 minutes to write</text><text x="1016" y="842" class="ns">each card by hand.</text>
</svg>