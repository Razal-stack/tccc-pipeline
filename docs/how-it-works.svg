<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" role="img" aria-label="How a recorded handover becomes a TCCC card" style="width:100%;height:auto;font-family:Geist,system-ui,-apple-system,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a9894"/></marker>
<style>.t{font-size:16px;font-weight:600;fill:#181818}.s{font-size:13px;fill:#5f5d5a}.c{font-size:12px;fill:#414141}
.ln{font-size:11px;font-weight:600;fill:#868685;letter-spacing:.08em}.lt{font-size:15px;font-weight:600;fill:#181818}.lw{font-size:12px;fill:#868685}</style></defs>
<rect x="20" y="20" width="4" height="70" rx="2" fill="#c9c7c2"/><text x="36" y="46" class="ln">INPUT</text><text x="36" y="66" class="lt">Recording</text><text x="36" y="84" class="lw">as recorded</text>
<rect x="20" y="140" width="4" height="90" rx="2" fill="#0065b4"/><text x="36" y="166" class="ln">STEP 1</text><text x="36" y="186" class="lt">Listen</text><text x="36" y="204" class="lw">AI, two tools</text>
<rect x="20" y="280" width="4" height="90" rx="2" fill="#0065b4"/><text x="36" y="306" class="ln">STEP 2</text><text x="36" y="326" class="lt">Read</text><text x="36" y="344" class="lw">AI</text>
<rect x="20" y="420" width="4" height="100" rx="2" fill="#868685"/><text x="36" y="446" class="ln">STEP 3</text><text x="36" y="466" class="lt">Check</text><text x="36" y="484" class="lw">fixed rules</text>
<rect x="20" y="570" width="4" height="90" rx="2" fill="#c9c7c2"/><text x="36" y="596" class="ln">STEP 4</text><text x="36" y="616" class="lt">Output</text><text x="36" y="634" class="lw">card + to-do list</text>
<rect x="20" y="710" width="4" height="90" rx="2" fill="#2f7d4f"/><text x="36" y="736" class="ln">STEP 5</text><text x="36" y="756" class="lt">Medic</text><text x="36" y="774" class="lw">a person decides</text>
<rect x="410" y="20" width="350" height="70" rx="12" fill="#ffffff" stroke="#c9c7c2" stroke-width="1.5"/><text x="585.0" y="50" text-anchor="middle" class="t">Recorded handover</text><text x="585.0" y="72" text-anchor="middle" class="s">radio crackle, gunfire, two voices: not cut, not cleaned</text>
<path d="M585,90 C585,115.0 390,115.0 390,136" fill="none" stroke="#9a9894" stroke-width="1.6" marker-end="url(#a)"/><path d="M585,90 C585,115.0 780,115.0 780,136" fill="none" stroke="#9a9894" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="230" y="140" width="320" height="90" rx="12" fill="#eef5fb" stroke="#0065b4" stroke-width="1.5"/><text x="390.0" y="170" text-anchor="middle" class="t">Listener 1: ElevenLabs Scribe</text><text x="390.0" y="192" text-anchor="middle" class="s">medical speech-to-text, told to expect</text><text x="390.0" y="211" text-anchor="middle" class="s">words like TXA, IV, tourniquet</text>
<rect x="620" y="140" width="320" height="90" rx="12" fill="#eef5fb" stroke="#0065b4" stroke-width="1.5"/><text x="780.0" y="170" text-anchor="middle" class="t">Listener 2: Qwen Omni</text><text x="780.0" y="192" text-anchor="middle" class="s">a second, independent</text><text x="780.0" y="211" text-anchor="middle" class="s">speech-to-text listen</text>
<path d="M390,230 C390,255.0 530,255.0 530,276" fill="none" stroke="#9a9894" stroke-width="1.6" marker-end="url(#a)"/><path d="M780,230 C780,255.0 640,255.0 640,276" fill="none" stroke="#9a9894" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="370" y="280" width="430" height="90" rx="12" fill="#eef5fb" stroke="#0065b4" stroke-width="1.5"/><text x="585.0" y="310" text-anchor="middle" class="t">Reader: Gemini Flash</text><text x="585.0" y="332" text-anchor="middle" class="s">fills each box, quoting the words it used;</text><text x="585.0" y="351" text-anchor="middle" class="s">if the listeners disagree, leaves it blank and flags it</text>
<path d="M585,370 C585,395.0 585,395.0 585,416" fill="none" stroke="#9a9894" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="235" y="420" width="705" height="100" rx="12" fill="#f4f3ef" stroke="#868685" stroke-width="1.5"/>
<text x="587" y="450" text-anchor="middle" class="t">Automatic checks on every value</text><rect x="243" y="468" width="133" height="34" rx="17" fill="#ffffff" stroke="#c9c7c2"/><text x="309.5" y="490" text-anchor="middle" class="c">said in the recording?</text><rect x="382" y="468" width="133" height="34" rx="17" fill="#ffffff" stroke="#c9c7c2"/><text x="448.5" y="490" text-anchor="middle" class="c">right format?</text><rect x="521" y="468" width="133" height="34" rx="17" fill="#ffffff" stroke="#c9c7c2"/><text x="587.5" y="490" text-anchor="middle" class="c">medically plausible?</text><rect x="660" y="468" width="133" height="34" rx="17" fill="#ffffff" stroke="#c9c7c2"/><text x="726.5" y="490" text-anchor="middle" class="c">anything missing?</text><rect x="799" y="468" width="133" height="34" rx="17" fill="#ffffff" stroke="#c9c7c2"/><text x="865.5" y="490" text-anchor="middle" class="c">both listeners agree?</text>
<path d="M587,520 C587,545.0 390,545.0 390,566" fill="none" stroke="#9a9894" stroke-width="1.6" marker-end="url(#a)"/><path d="M587,520 C587,545.0 780,545.0 780,566" fill="none" stroke="#9a9894" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="230" y="570" width="320" height="90" rx="12" fill="#ffffff" stroke="#c9c7c2" stroke-width="1.5"/><text x="390.0" y="600" text-anchor="middle" class="t">TCCC card (DD Form 1380)</text><text x="390.0" y="622" text-anchor="middle" class="s">filled PDF and body diagram,</text><text x="390.0" y="641" text-anchor="middle" class="s">read back to confirm every box</text>
<rect x="620" y="570" width="320" height="90" rx="12" fill="#ffffff" stroke="#c9c7c2" stroke-width="1.5"/><text x="780.0" y="600" text-anchor="middle" class="t">Medic's to-do list</text><text x="780.0" y="622" text-anchor="middle" class="s">what to ask the sender, what to check,</text><text x="780.0" y="641" text-anchor="middle" class="s">confidence for each value</text>
<path d="M390,660 C390,685.0 520,685.0 520,706" fill="none" stroke="#9a9894" stroke-width="1.6" marker-end="url(#a)"/><path d="M780,660 C780,685.0 650,685.0 650,706" fill="none" stroke="#9a9894" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="335" y="710" width="500" height="90" rx="12" fill="#eaf5ee" stroke="#2f7d4f" stroke-width="1.5"/><text x="585.0" y="740" text-anchor="middle" class="t">Medic reviews, signs and attaches</text><text x="585.0" y="762" text-anchor="middle" class="s">the card travels with the casualty;</text><text x="585.0" y="781" text-anchor="middle" class="s">evacuation goes most urgent first</text>
</svg>